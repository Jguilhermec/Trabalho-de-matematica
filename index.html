<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>bolsosemfuro — Gestão Financeira</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    background-color: #0f1219;
    color: #e2e8f0;
    min-height: 100vh;
    line-height: 1.5;
}

header {
    background: #161b26;
    padding: 40px 20px;
    text-align: center;
    border-bottom: 1px solid #232b3e;
}

header h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
    margin-bottom: 6px;
}

header p {
    color: #94a3b8;
    font-size: 15px;
    font-weight: 400;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 24px;
}

.card {
    background: #161b26;
    border: 1px solid #232b3e;
    border-radius: 12px;
    padding: 30px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
}

.card h2 {
    font-size: 18px;
    font-weight: 600;
    color: #f8fafc;
    margin-bottom: 20px;
    letter-spacing: -0.01em;
}

input,
select {
    width: 100%;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #2a3447;
    background: #0f1219;
    color: #f8fafc;
    font-size: 15px;
    font-weight: 400;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input:focus,
select:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

/* PERFIS */

.perfis {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 16px;
}

.perfil {
    background: #0f1219;
    border: 1px solid #2a3447;
    border-radius: 10px;
    padding: 20px 16px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
}

.perfil:hover {
    border-color: #475569;
    transform: translateY(-2px);
}

.perfil.ativo {
    border-color: #3b82f6;
    background: #1e2638;
}

.perfil .emoji {
    font-size: 24px;
    margin-bottom: 8px;
}

.perfil h3 {
    font-size: 15px;
    font-weight: 600;
    color: #f1f5f9;
    margin-bottom: 6px;
}

.perfil p {
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.4;
}

/* BOTÕES */

.botoes {
    display: flex;
    gap: 12px;
    margin-top: 24px;
}

button {
    flex: 1;
    padding: 14px 20px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.01em;
}

button:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
}

.botao-sugestao {
    background: #4f46e5;
}

.botao-sugestao:hover {
    background: #4338ca;
}

.botao-redistribuir {
    background: #059669;
}

.botao-redistribuir:hover {
    background: #047857;
}

.botao-cancelar {
    background: #334155;
    color: #cbd5e1;
}

.botao-cancelar:hover {
    background: #475569;
}

/* GASTOS */

.expenses {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
}

.expense {
    background: #0f1219;
    padding: 16px;
    border-radius: 8px;
    border: 1px solid #2a3447;
}

.expense label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #cbd5e1;
    margin-bottom: 8px;
}

.expense small {
    display: block;
    color: #64748b;
    font-size: 12px;
    margin-top: 6px;
}

/* RESULTADO */

.resultado {
    display: none;
}

.summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
}

.summary-box {
    padding: 20px;
    border-radius: 8px;
    background: #0f1219;
    border: 1px solid #2a3447;
}

.summary-box h3 {
    color: #94a3b8;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    font-weight: 600;
}

.summary-box strong {
    font-size: 22px;
    font-weight: 700;
}

.positive {
    color: #10b981;
}

.negative {
    color: #ef4444;
}

/* BARRAS */

.bars {
    margin-top: 20px;
}

.bar-item {
    margin-bottom: 16px;
}

.bar-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    color: #cbd5e1;
    font-size: 13px;
    font-weight: 500;
}

.bar {
    height: 8px;
    background: #0f1219;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #2a3447;
}

.bar-fill {
    height: 100%;
    width: 0;
    background: #3b82f6;
    border-radius: 4px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* INTELIGÊNCIA */

.inteligencia {
    display: none;
    margin-top: 28px;
    padding: 24px;
    border-radius: 10px;
    background: #111827;
    border: 1px solid #1f2937;
}

.inteligencia h2 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #f3f4f6;
}

.inteligencia p {
    color: #9ca3af;
    font-size: 14px;
    line-height: 1.6;
}

.alerta {
    margin-top: 16px;
    padding: 16px;
    background: #0f1219;
    border-radius: 8px;
    border-left: 3px solid #3b82f6;
    font-size: 14px;
}

.excesso {
    color: #f59e0b;
    font-weight: 600;
}

.reserva {
    color: #10b981;
    font-weight: 600;
}

/* REDISTRIBUIÇÃO */

.redistribuicao {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background: #0f1219;
    border-radius: 8px;
    border: 1px solid #2a3447;
}

.redistribuicao h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #f8fafc;
}

.destino {
    margin-top: 14px;
}

.destino label {
    display: block;
    margin-bottom: 6px;
    color: #94a3b8;
    font-size: 13px;
}

.acoes {
    display: flex;
    gap: 10px;
    margin-top: 16px;
}

.mensagem {
    margin-top: 24px;
    padding: 16px;
    border-radius: 8px;
    background: #0f1219;
    border: 1px solid #2a3447;
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.5;
}

footer {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    padding: 40px 20px;
}

@media(max-width:700px) {

    header h1 {
        font-size: 24px;
    }

    .perfis {
        grid-template-columns: 1fr;
    }

    .botoes,
    .acoes {
        flex-direction: column;
    }

    .container {
        padding: 0 16px;
    }

    .card {
        padding: 20px;
    }

}

</style>

</head>

<header>

<h1>bolsosem
